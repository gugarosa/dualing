[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dualing"
version = "2.0.1"
description = "Dual-based neural learning with TensorFlow"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Gustavo Rosa", email = "gustavo.rosa@unesp.br" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "tensorflow>=2.16",
]

[project.urls]
Homepage = "https://github.com/gugarosa/dualing"
Documentation = "https://dualing.readthedocs.io"
Issues = "https://github.com/gugarosa/dualing/issues"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
docs = [
    "sphinx>=8.2",
]

[tool.setuptools.packages.find]
include = ["dualing*"]

[tool.pytest.ini_options]
addopts = ["-q"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]